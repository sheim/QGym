[project]
name = "q2"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mujoco>=3.6",
    "torch",
    "tensordict",
    "numpy",
    "pygame",
    "mss",
    "wandb",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
gpu = ["mujoco-warp>=3.6"]
# vsim backend: closed-source engine, local wheel from ../vlearn (cp311 only —
# repo is pinned to 3.11 for this). Install with: uv sync --extra vsim
# Requires system libczmq4 and a valid node-locked license (see README there).
vsim = ["vlearn"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest",
    "ruff>=0.15.9",
    "mujoco-warp>=3.6",
]

[tool.uv.sources]
# Vendored in-repo (gitignored — see thirdparty/vlearn/README.md for the drop-in
# procedure on a new machine).
vlearn = { path = "thirdparty/vlearn/vlearn-0.3.12-cp311-cp311-linux_x86_64.whl" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gym", "gym.envs", "gym.envs.base", "gym.envs.mini_cheetah",
            "gym.envs.mit_humanoid", "gym.utils",
            "learning", "learning.algorithms", "learning.modules",
            "learning.runners", "learning.storage", "learning.utils",
            "learning.utils.logger"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__init__.py",
    "logs/",
]

line-length = 88
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
ignore = ["E722"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = ["E", "F", "W", "E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
