name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  cpu-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install uv

      - name: Sync locked environment
        run: |
          uv sync --frozen

      - name: Run mandatory test gate
        run: |
          uv run --frozen python -m pytest -q
