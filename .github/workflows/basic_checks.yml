name: Check Added/Modified File Sizes

on: [push, pull_request, workflow_dispatch]

jobs:
  file-size-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Fetch the full history for all branches and tags to correctly compare diffs
        fetch-depth: 0

    - name: Check for large added/modified files
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        FILE_SIZE_LIMIT=102400 # 100 KiB; uv.lock is exempt dependency metadata.

        # New branches and manual runs compare with the default branch,
        # so inherited assets are not treated as newly added files.
        if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
          BASE_SHA="refs/remotes/origin/$DEFAULT_BRANCH"
        fi

        echo "Checking added/modified files between $BASE_SHA and $HEAD_SHA"

        # Disable rename detection to check renamed files as additions.
        # NUL separation preserves spaces; blob sizes refer to the event head,
        # including when checkout has produced a PR merge commit.
        git diff --name-only --diff-filter=AMT --no-renames -z \
          "$BASE_SHA" "$HEAD_SHA" -- . ':!uv.lock' |
        while IFS= read -r -d '' FILE; do
          FILE_SIZE=$(git cat-file -s "$HEAD_SHA:$FILE")
          if [ "$FILE_SIZE" -gt "$FILE_SIZE_LIMIT" ]; then
            echo "$FILE exceeds the 100 KiB limit ($FILE_SIZE bytes)." >&2
            exit 1
          fi
        done
